name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# impit is a native module whose binary lives in a per-platform package, so a
# VSIX only works on the platform it was built on. Each runner builds its own.
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Verify before packaging
        run: |
          bun run typecheck
          bun test

      # --no-dependencies because this repo installs with bun, so vsce's own
      # npm-based dependency walk cannot run. The build step copies impit into
      # dist/node_modules, which ships either way.
      - name: Package
        run: bunx @vscode/vsce package --no-dependencies --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.vsix
          generate_release_notes: true
