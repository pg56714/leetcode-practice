name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The same Bun as package.json's packageManager, so CI checks with what
      # the lockfile was written by rather than whatever was released today.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Types
        run: bun run typecheck

      - name: Lint and format
        run: bun run lint

      - name: Tests
        run: bun test

      # Builds the bundle and copies the native module, which is where a
      # packaging mistake shows up rather than in the type checker.
      - name: Build
        run: bun run compile
